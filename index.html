<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARDBORN Approved</title>
<style>body{background:#0b0b0d;color:#eee;font-family:system-ui;margin:0;padding:24px}h2{border-bottom:1px solid #333;padding-bottom:6px;margin-top:36px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.c{background:#16161a;border-radius:10px;overflow:hidden}.c img{width:100%;display:block}.c div{padding:8px 10px;font-size:14px}small{color:#888}</style></head>
<body><h1>SHARDBORN — Approved</h1><div id="r"></div>
<script>fetch('approved.json?'+Date.now()).then(r=>r.json()).then(a=>{r.innerHTML=a.map(s=>`<h2>${s.faction} <small>(${s.items.length})</small></h2><div class="g">${s.items.map(x=>`<div class="c"><a href="${x.file}"><img src="${x.file}" loading="lazy"></a><div>${x.name}<br><small>${x.id}</small></div></div>`).join('')}</div>`).join('')})</script></body></html>
