<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHARDBORN Approved</title>
<style>body{background:#0b0b0d;color:#eee;font-family:system-ui;margin:0;padding:24px}h2{border-bottom:1px solid #333;padding-bottom:6px;margin-top:36px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.c{background:#16161a;border-radius:10px;overflow:hidden}.c img{width:100%;display:block}.c .m{padding:8px 10px;font-size:14px}small{color:#888}.note{background:#1d1d24;border-radius:8px;padding:10px 12px;font-size:14px}.note a,#t a{color:#7cf}.b{display:flex;gap:8px;margin-top:8px}button{flex:1;padding:10px;border:0;border-radius:6px;font-size:15px;color:#fff;cursor:pointer}.fx{background:#2b5cff}.dl{background:#b8323a}.cp{background:#2a9d4b;width:100%;margin-top:6px}textarea{width:100%;box-sizing:border-box;margin-top:8px;background:#0b0b0d;color:#eee;border:1px solid #444;border-radius:6px;padding:8px;font-size:16px;min-height:60px}.fb{display:none}.fb.on{display:block}#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;border:1px solid #555;padding:12px 16px;border-radius:8px;display:none;max-width:90vw;z-index:9;font-size:14px}#t textarea{min-height:50px}</style></head>
<body><h1>SHARDBORN — Approved</h1><div class="note">Tap <b>Fix</b> (describe the change) or <b>Delete</b> under any image to copy an <code>@art</code> request, then paste it in the <a href="https://x.com/i/chat/g2112797833854156966" target="_blank">Art Studio Bases chat</a>, and I'll pick it up on my next check.</div><div id="r"></div><div id="t"></div>
<script>
const CHAT='https://x.com/i/chat/g2112797833854156966';
function toast(txt,ok){const t=document.getElementById('t');t.innerHTML=ok?`Copied, paste it in the <a href="${CHAT}" target="_blank">Art Studio Bases chat</a>`:`Copy failed. Text is selected, copy it manually, then paste it in the <a href="${CHAT}" target="_blank">Art Studio Bases chat</a><textarea readonly></textarea>`;t.style.display='block';if(!ok){const a=t.querySelector('textarea');a.value=txt;a.focus();a.select();a.setSelectionRange(0,txt.length)}clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ok?5000:20000)}
function legacy(txt){const a=document.createElement('textarea');a.value=txt;a.setAttribute('readonly','');a.style.position='fixed';a.style.top='0';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,txt.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
function copy(txt){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>toast(txt,true),()=>toast(txt,legacy(txt)))}else toast(txt,legacy(txt))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('approved.json?'+Date.now()).then(r=>r.json()).then(a=>{r.innerHTML=a.map(s=>`<h2>${s.faction} <small>(${s.items.length})</small></h2><div class="g">${s.items.map(x=>`<div class="c" data-id="${esc(x.id)}" data-name="${esc(x.name)}"><a href="${x.file}"><img src="${x.file}" loading="lazy"></a><div class="m">${esc(x.name)}<br><small>${esc(x.id)}</small><div class="b"><button class="fx">Fix</button><button class="dl">Delete</button></div><div class="fb"><textarea placeholder="What should change?"></textarea><button class="cp">Copy request</button></div></div></div>`).join('')}</div>`).join('')});
r.addEventListener('click',e=>{const c=e.target.closest('.c');if(!c)return;const id=c.dataset.id,n=c.dataset.name;
if(e.target.classList.contains('fx')){const f=c.querySelector('.fb');f.classList.toggle('on');if(f.classList.contains('on'))f.querySelector('textarea').focus()}
else if(e.target.classList.contains('dl'))copy(`@art delete ${id} ${n}`);
else if(e.target.classList.contains('cp')){const v=c.querySelector('.fb textarea').value.trim();if(!v){c.querySelector('.fb textarea').focus();return}copy(`@art fix ${id} ${n}: ${v}`)}});
</script></body></html>
